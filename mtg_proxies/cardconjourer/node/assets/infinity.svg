<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Bare "∞" glyph for rules text — no circular mana-pip badge. CC's own bundled
  {inf} mana symbol (img/manaSymbols/inf.svg) draws the same lemniscate path
  but on a filled gray circle, styled like a mana cost pip; that's wrong for
  Marvel Infinity Stone cards (SPM), whose oracle text uses "∞" as a bare
  ability-word marker, matching the printed card. This is that same path
  lifted out of CC's asset (same license: vendored alongside the rest of the
  CC symbol set) with the circle dropped and the viewBox left untouched so it
  scales/positions identically through the existing mana-symbol pipeline.
-->
